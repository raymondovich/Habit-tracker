<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#050505">

<title>JOB & CASH</title>

<link rel="stylesheet" href="design/style.css">
```

</head>

<body>

<div class="app">

```
<!-- HEADER -->
<header class="app-header">

    <div class="brand">

        <div class="brand-title">
            JOB & CASH
        </div>

        <div
            class="brand-subtitle"
            id="currentDate"
        >
            —
        </div>

    </div>

</header>


<!-- MAIN -->
<main class="main-content">


    <!-- PERIOD -->
    <section class="period-switcher" id="periodSwitcher">

        <button
            class="period-button active"
            data-period="week"
            type="button"
        >
            Неделя
        </button>

        <button
            class="period-button"
            data-period="month"
            type="button"
        >
            Месяц
        </button>

        <button
            class="period-button"
            data-period="year"
            type="button"
        >
            Год
        </button>

    </section>


    <!-- EARNINGS -->
    <section class="earnings-card">

        <div class="earnings-value" id="totalEarnings">
            €0.00
        </div>

        <div class="earnings-period" id="earningsPeriod">
            За эту неделю
        </div>

    </section>


    <!-- QUICK STATS -->
    <section class="quick-stats">

        <div class="stat-card">

            <div
                class="stat-value"
                id="shiftCount"
            >
                0
            </div>

            <div class="stat-label">
                Смен
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-value"
                id="workedHours"
            >
                0
            </div>

            <div class="stat-label">
                Часов
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-value"
                id="averageEarnings"
            >
                €0.00
            </div>

            <div class="stat-label">
                Средний заработок
            </div>

        </div>

    </section>


    <!-- RATE -->
    <section class="rate-card">

        <div>

            <div class="rate-value" id="currentRate">
                €0.00
            </div>

        </div>

        <button
            class="secondary-button"
            id="changeRateButton"
            type="button"
        >
            Изменить ставку
        </button>

    </section>


    <!-- ADD SHIFT -->
    <section>

        <button
            class="primary-button"
            id="addShiftButton"
            type="button"
        >
            <span class="button-icon">＋</span>
            Добавить смену
        </button>

    </section>


    <!-- SHIFTS -->
    <section class="shifts-section">

        <div class="section-header">

            <h2>
                Последние смены
            </h2>

            <button
                class="text-button"
                id="allShiftsButton"
                type="button"
            >
                Все
            </button>

        </div>


        <div
            class="shifts-list"
            id="shiftsList"
        >

            <div
                class="empty-state"
                id="emptyShifts"
            >
                Смен пока нет
            </div>

        </div>

    </section>


    <!-- STATISTICS -->
    <section class="statistics-preview">

        <div class="section-header">

            <h2>
                Статистика
            </h2>

            <button
                class="text-button"
                id="statisticsButton"
                type="button"
            >
                Подробнее
            </button>

        </div>


        <div class="statistics-grid">

            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestWeek"
                >
                    €0.00
                </div>

                <div class="statistics-label">
                    Лучшая неделя
                </div>

            </div>


            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestMonth"
                >
                    €0.00
                </div>

                <div class="statistics-label">
                    Лучший месяц
                </div>

            </div>


            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestYear"
                >
                    €0.00
                </div>

                <div class="statistics-label">
                    Лучший год
                </div>

            </div>

        </div>

    </section>

</main>


<!-- FOOTER -->
<footer class="app-footer">

    Created by
    <a
        href="https://t.me/shkeltinsh"
        target="_blank"
        rel="noopener noreferrer"
    >
        @shkeltinsh
    </a>

</footer>
```

</div>

    НА ЭТОМ ЭТАПЕ ПОДКЛЮЧАЕМ

    type="module"
    src="modules/rate.js"
></script>

</body>
</html>
