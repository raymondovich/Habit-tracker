<!DOCTYPE html>

<html lang="ru">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050505"
>

<meta
    name="description"
    content="Job & Cash — приложение для учёта рабочих смен, часов и заработка."
>

<title>Job & Cash</title>

<link
    rel="stylesheet"
    href="design/style.css"
>


</head>

<body>

<div class="app">


<!-- =========================================
     HEADER
========================================== -->

<header class="app-header">

    <div class="brand">

        <div class="brand-title">
            JOB & CASH
        </div>

        <div
            class="brand-subtitle"
            id="currentDate"
        >
            —
        </div>

    </div>

</header>



<!-- =========================================
     MAIN
========================================== -->

<main class="main-content">


    <!-- =====================================
         PERIOD SELECTOR
    ====================================== -->

    <section class="period-section">

        <div
            class="period-switcher"
            id="periodSwitcher"
        >

            <button
                type="button"
                class="period-button active"
                data-period="week"
            >
                Неделя
            </button>


            <button
                type="button"
                class="period-button"
                data-period="month"
            >
                Месяц
            </button>


            <button
                type="button"
                class="period-button"
                data-period="year"
            >
                Год
            </button>

        </div>

    </section>



    <!-- =====================================
         MAIN EARNINGS
    ====================================== -->

    <section class="earnings-card">

        <div class="card-label">
            ЗАРАБОТАНО
        </div>


        <div
            class="earnings-value"
            id="totalEarnings"
        >
            €0.00
        </div>


        <div
            class="earnings-period"
            id="earningsPeriod"
        >
            За эту неделю
        </div>

    </section>



    <!-- =====================================
         QUICK STATS
    ====================================== -->

    <section class="quick-stats">


        <div class="stat-card">

            <div
                class="stat-value"
                id="shiftCount"
            >
                0
            </div>

            <div class="stat-label">
                СМЕН
            </div>

        </div>



        <div class="stat-card">

            <div
                class="stat-value"
                id="workedHours"
            >
                0
            </div>

            <div class="stat-label">
                ЧАСОВ
            </div>

        </div>



        <div class="stat-card">

            <div
                class="stat-value"
                id="averageEarnings"
            >
                €0.00
            </div>

            <div class="stat-label">
                В СРЕДНЕМ
            </div>

        </div>


    </section>



    <!-- =====================================
         CURRENT RATE
    ====================================== -->

    <section class="rate-card">


        <div class="rate-info">

            <div class="card-label">
                ПОЧАСОВАЯ СТАВКА
            </div>


            <div
                class="rate-value"
                id="currentRate"
            >
                €0.00
            </div>

        </div>


        <button
            type="button"
            class="secondary-button"
            id="changeRateButton"
        >
            Изменить
        </button>


    </section>



    <!-- =====================================
         ADD SHIFT
    ====================================== -->

    <section class="add-shift-section">


        <button
            type="button"
            class="primary-button"
            id="addShiftButton"
        >

            <span class="button-icon">
                +
            </span>

            <span>
                Добавить смену
            </span>

        </button>


    </section>



    <!-- =====================================
         RECENT SHIFTS
    ====================================== -->

    <section class="shifts-section">


        <div class="section-header">

            <h2>
                Последние смены
            </h2>


            <button
                type="button"
                class="text-button"
                id="allShiftsButton"
            >
                Все
            </button>

        </div>



        <div
            class="shifts-list"
            id="shiftsList"
        >


            <div
                class="empty-state"
                id="emptyShifts"
            >

                <div class="empty-icon">
                    —
                </div>


                <div class="empty-title">
                    Смен пока нет
                </div>


                <div class="empty-description">
                    Добавь первую смену, чтобы начать
                    отслеживать заработок.
                </div>

            </div>


        </div>


    </section>



    <!-- =====================================
         STATISTICS PREVIEW
    ====================================== -->

    <section class="statistics-preview">


        <div class="section-header">

            <h2>
                Статистика
            </h2>


            <button
                type="button"
                class="text-button"
                id="statisticsButton"
            >
                Открыть
            </button>

        </div>



        <div class="statistics-grid">


            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestWeek"
                >
                    €0.00
                </div>


                <div class="statistics-label">
                    ЛУЧШАЯ НЕДЕЛЯ
                </div>

            </div>



            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestMonth"
                >
                    €0.00
                </div>


                <div class="statistics-label">
                    ЛУЧШИЙ МЕСЯЦ
                </div>

            </div>



            <div class="statistics-item">

                <div
                    class="statistics-value"
                    id="bestYear"
                >
                    €0.00
                </div>


                <div class="statistics-label">
                    ЛУЧШИЙ ГОД
                </div>

            </div>


        </div>


    </section>


</main>



<!-- =========================================
     FOOTER
========================================== -->

<footer class="app-footer">

    <a
        href="https://t.me/shkeltinsh"
        target="_blank"
        rel="noopener noreferrer"
    >
        Created by @shkeltinsh
    </a>

</footer>


</div>

<!-- =========================================
     JAVASCRIPT
========================================== -->

<script
    type="module"
    src="modules/rate.js"
></script>

<script
    type="module"
    src="modules/shifts.js"
></script>

<script
    type="module"
    src="modules/earnings.js"
></script>

</body>

</html>
